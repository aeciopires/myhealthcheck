# Tool versions managed by mise (https://mise.jdx.dev).
# Install everything with:  make install-deps   (or: mise trust && mise install)
# Docker and Docker Compose are NOT managed here: install them separately.

[tools]
python = "3.15.2"
uv = "0.13.8"
helm = "4.3.2"
kubectl = "1.37.2"
helm-docs = "1.14.2"
kind = "0.33.0"
hadolint = "2.15.1"
shellcheck = "0.11.0"
yamllint = "1.38.0"
trivy = "0.76.2"

[env]
# Make uv use the Python installed by mise instead of downloading its own.
UV_PYTHON_PREFERENCE = "only-system"
UV_PYTHON = "3.15.2"
