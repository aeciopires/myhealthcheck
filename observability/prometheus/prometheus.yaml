# Prometheus - scrapes myhealthcheck and the observability stack.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yaml

scrape_configs:
  - job_name: myhealthcheck
    static_configs:
      - targets: ["myhealthcheck:8000"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
  - job_name: jaeger
    static_configs:
      - targets: ["jaeger:8888"]
