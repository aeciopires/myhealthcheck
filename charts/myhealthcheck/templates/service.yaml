apiVersion: v1
kind: Service
metadata:
  name: {{ include "myhealthcheck.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "myhealthcheck.labels" . | nindent 4 }}
  annotations:
    # myhealthcheck checks itself when discovery scans its namespace.
    myhealthcheck.io/port: http
    myhealthcheck.io/paths: /health/live
    {{- with .Values.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "myhealthcheck.selectorLabels" . | nindent 4 }}
