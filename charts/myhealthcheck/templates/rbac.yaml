{{- /*
Read-only permissions for Kubernetes discovery.
The 2.x chart granted "create" on namespaces/services, used a non-unique
ClusterRole name and tied RBAC to serviceAccount.create - all fixed here.
*/ -}}
{{- if and .Values.rbac.create .Values.config.discovery.enabled }}
{{- $saName := include "myhealthcheck.serviceAccountName" . }}
{{- if .Values.rbac.clusterWide }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "myhealthcheck.clusterRoleName" . }}
  labels:
    {{- include "myhealthcheck.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "myhealthcheck.clusterRoleName" . }}
  labels:
    {{- include "myhealthcheck.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "myhealthcheck.clusterRoleName" . }}
  apiGroup: rbac.authorization.k8s.io
{{- else }}
{{- if not .Values.config.discovery.namespaces }}
{{- fail "rbac.clusterWide=false requires config.discovery.namespaces to list the namespaces to scan" }}
{{- end }}
{{- range $ns := .Values.config.discovery.namespaces }}
{{- if or (contains "*" $ns) (contains "?" $ns) (contains "[" $ns) }}
{{- fail (printf "namespace pattern %q needs rbac.clusterWide=true (listing namespaces is cluster-scoped)" $ns) }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "myhealthcheck.fullname" $ }}
  namespace: {{ $ns }}
  labels:
    {{- include "myhealthcheck.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "myhealthcheck.fullname" $ }}
  namespace: {{ $ns }}
  labels:
    {{- include "myhealthcheck.labels" $ | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ $.Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "myhealthcheck.fullname" $ }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
{{- end }}
