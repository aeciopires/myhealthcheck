{{- if and .Values.config.alerting.webhookUrl (not .Values.config.alerting.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "myhealthcheck.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "myhealthcheck.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.config.alerting.existingSecretKey }}: {{ .Values.config.alerting.webhookUrl | quote }}
{{- end }}
