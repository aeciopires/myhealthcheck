[project]
name = "myhealthcheck"
version = "3.0.0"
description = "Health check system that monitors the availability of other applications, with static targets and Kubernetes service discovery."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Aécio Pires" }]
requires-python = ">=3.13"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Framework :: FastAPI",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "fastapi>=0.163.1",
  "uvicorn>=0.54.0",
  "httpx>=0.28.1",
  "pydantic>=2.14.3",
  "pydantic-settings>=2.16.3",
  "kubernetes>=37.0.2",
  "prometheus-client>=0.26.0",
  "pyyaml>=6.0.3",
  "opentelemetry-api>=1.45.2",
  "opentelemetry-sdk>=1.45.2",
  "opentelemetry-exporter-otlp-proto-http>=1.45.2",
  "opentelemetry-instrumentation-fastapi>=0.66b2",
  "opentelemetry-instrumentation-httpx>=0.66b2",
]

[project.scripts]
myhealthcheck = "myhealthcheck.cli:main"

[project.urls]
Homepage = "https://github.com/aeciopires/myhealthcheck"

[dependency-groups]
dev = [
  "pytest>=9.2.0",
  "pytest-asyncio>=1.5.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.17.5",
  "mypy>=2.4.1",
  "types-PyYAML>=6.0.12",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myhealthcheck"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "N", "S", "PTH", "ASYNC", "PT", "RET", "TRY",
]
ignore = [
  "S104",   # binding to 0.0.0.0 is intended inside containers
  "TRY003", # long messages in exceptions are fine
  "TRY400", # expected errors are logged without traceback on purpose
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "PT011", "PT012", "TRY301", "ASYNC109"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["kubernetes.*", "prometheus_client.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
filterwarnings = [
  "error::pytest.PytestUnraisableExceptionWarning",
  # Starlette suggests httpx2 for its TestClient; httpx is still what we use.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["myhealthcheck"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.coverage.xml]
output = "coverage.xml"
